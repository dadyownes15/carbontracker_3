<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">External usage lands on a span and cuts nothing</title>
  <desc id="desc">One document over 5 seconds. Spans embed, llm_call and score cut the CPU and the GPU, and each segment is measured and billed to its span. At 3.8 s the LLM call's response arrives with 3 100 input and 420 output tokens; an estimator turns them into 2.03 Wh, and the entry lands on llm_call without cutting either local source. The table bills each span its local and its external part apart, and adds them only in the total.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --faint: #d1d9e0; --lane: #f6f8fa;
          --done: #2a9d8f; --ext: #8250df; --open: #eaeef2; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --faint: #3d444d; --lane: #161b22;
            --done: #36b3a2; --ext: #a371f7; --open: #21262d; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--fg);
           paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 16px; font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11px; }
    .label { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; fill: var(--muted); }
    .name { font-weight: 600; }
    .ext { fill: var(--ext); }
    .exttext { fill: var(--ext); font-weight: 600; }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--faint); }
    .span { fill: var(--open); stroke: var(--fg); stroke-width: 1; }
    .done { fill: var(--done); }
    .seg { stroke: var(--bg); stroke-width: 1.5; }
    .cut { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 2 3; opacity: .75; }
    .rule { stroke: var(--faint); stroke-width: 1; }
    .rulestrong { stroke: var(--fg); stroke-width: 1; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .extline { stroke: var(--ext); stroke-width: 1.5; fill: none; }
    .arrowhead { fill: var(--ext); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="560"/>

  <text class="title" x="24" y="32">External usage lands on a span and cuts nothing</text>
  <text class="muted" x="24" y="52">One document, 0–5 s. Every span selects all sources. The LLM call runs on someone else's hardware.</text>

  <!-- Cut guides: through the spans and the local lanes, never the external lane -->
  <g class="cut">
    <line x1="160" y1="80" x2="160" y2="140"/><line x1="160" y1="200" x2="160" y2="300"/>
    <line x1="340" y1="80" x2="340" y2="140"/><line x1="340" y1="200" x2="340" y2="300"/>
    <line x1="640" y1="80" x2="640" y2="140"/><line x1="640" y1="200" x2="640" y2="300"/>
    <line x1="760" y1="80" x2="760" y2="140"/><line x1="760" y1="200" x2="760" y2="300"/>
  </g>

  <!-- Spans -->
  <text class="label" x="24" y="102">SPANS</text>
  <rect class="span" x="160" y="86" width="600" height="22" rx="3"/>
  <text class="name" x="168" y="101">doc</text>
  <rect class="span" x="160" y="114" width="180" height="22" rx="3"/>
  <text class="name" x="168" y="129">embed</text>
  <rect class="span" x="340" y="114" width="300" height="22" rx="3"/>
  <text class="name" x="348" y="129">llm_call</text>
  <rect class="span" x="640" y="114" width="120" height="22" rx="3"/>
  <text class="name" x="648" y="129">score</text>
  <text class="small muted" x="780" y="101">Each start and stop cuts</text>
  <text class="small muted" x="780" y="116">every source the span selects.</text>

  <!-- External lane -->
  <text class="label" x="24" y="168">EXTERNAL</text>
  <text class="small muted" x="24" y="184">not measured here</text>
  <rect class="lane" x="160" y="148" width="600" height="44" rx="3"/>
  <path class="ext" d="M616,160 L626,170 L616,180 L606,170 z"/>
  <line class="extline" x1="616" y1="160" x2="616" y2="139" marker-end="url(#arrow)"/>
  <text class="small" x="598" y="166" text-anchor="end"><tspan class="exttext">3.8 s</tspan> response: 3 100 in + 420 out tokens</text>
  <text class="small" x="598" y="182" text-anchor="end">→ <tspan class="exttext">2.03 Wh</tspan>, modelled by <tspan class="name">llm-tokens</tspan></text>
  <text class="small exttext" x="780" y="166">Lands on the open span.</text>
  <text class="small muted" x="780" y="182">Cuts nothing, asks no provider.</text>

  <!-- CPU lane -->
  <text class="label" x="24" y="226">CPU</text>
  <text class="small muted" x="24" y="242">measured</text>
  <rect class="lane" x="160" y="204" width="600" height="44" rx="3"/>
  <rect class="done seg" x="160" y="226" width="180" height="22" fill-opacity=".85"/>
  <rect class="done seg" x="340" y="240" width="300" height="8" fill-opacity=".85"/>
  <rect class="done seg" x="640" y="224" width="120" height="24" fill-opacity=".85"/>
  <text class="small" x="168" y="220">18 W · embed</text>
  <text class="small" x="348" y="234">6 W · llm_call (waiting)</text>
  <text class="small" x="648" y="218">20 W · score</text>

  <!-- GPU lane -->
  <text class="label" x="24" y="276">GPU</text>
  <text class="small muted" x="24" y="292">measured</text>
  <rect class="lane" x="160" y="254" width="600" height="44" rx="3"/>
  <rect class="done seg" x="160" y="262" width="180" height="36" fill-opacity=".85"/>
  <rect class="done seg" x="340" y="290" width="300" height="8" fill-opacity=".85"/>
  <rect class="done seg" x="640" y="290" width="120" height="8" fill-opacity=".85"/>
  <text class="small" x="168" y="284" style="fill: var(--bg); stroke: none; font-weight: 600">60 W · embed</text>
  <text class="small" x="348" y="284">8 W · llm_call</text>
  <text class="small" x="648" y="284">8 W · score</text>
  <text class="small muted" x="780" y="262">Each segment is billed</text>
  <text class="small muted" x="780" y="277">to its span, × PUE 1.58.</text>

  <!-- Time axis -->
  <line class="tick" x1="160" y1="308" x2="760" y2="308"/>
  <g class="tick">
    <line x1="160" y1="308" x2="160" y2="313"/><line x1="280" y1="308" x2="280" y2="313"/>
    <line x1="400" y1="308" x2="400" y2="313"/><line x1="520" y1="308" x2="520" y2="313"/>
    <line x1="640" y1="308" x2="640" y2="313"/><line x1="760" y1="308" x2="760" y2="313"/>
  </g>
  <g class="small muted" text-anchor="middle">
    <text x="160" y="326">0 s</text><text x="280" y="326">1</text><text x="400" y="326">2</text>
    <text x="520" y="326">3</text><text x="640" y="326">4</text><text x="760" y="326">5 s</text>
  </g>

  <!-- Legend -->
  <rect class="done" x="160" y="342" width="14" height="10" fill-opacity=".85"/>
  <text class="small" x="180" y="351">segment, measured and billed</text>
  <line class="cut" x1="368" y1="340" x2="368" y2="354"/>
  <text class="small" x="376" y="351">cut</text>
  <path class="ext" d="M412,341 L418,347 L412,353 L406,347 z"/>
  <text class="small" x="424" y="351">external entry: work, and the usage estimated from it</text>

  <!-- Bill table -->
  <text class="label" x="24" y="394">BILL</text>
  <g class="small muted" text-anchor="end">
    <text x="300" y="394">local Wh</text><text x="400" y="394">local g</text>
    <text x="540" y="394">external Wh</text><text x="640" y="394">external g</text>
    <text x="780" y="394">total Wh</text><text x="880" y="394">total g</text>
  </g>
  <line class="rule" x1="24" y1="402" x2="890" y2="402"/>
  <g class="small">
    <text x="24" y="420">embed</text>
    <text x="24" y="440">llm_call</text>
    <text x="24" y="460">score</text>
  </g>
  <g class="small" text-anchor="end">
    <text x="300" y="420">0.0514</text><text x="400" y="420">0.00734</text>
    <text x="540" y="420">0</text><text x="640" y="420">0</text>
    <text x="780" y="420">0.0514</text><text x="880" y="420">0.00734</text>

    <text x="300" y="440">0.0154</text><text x="400" y="440">0.00220</text>
    <text x="540" y="440" class="exttext">2.03</text><text x="640" y="440" class="exttext">0.582</text>
    <text x="780" y="440">2.04</text><text x="880" y="440">0.584</text>

    <text x="300" y="460">0.0123</text><text x="400" y="460">0.00176</text>
    <text x="540" y="460">0</text><text x="640" y="460">0</text>
    <text x="780" y="460">0.0123</text><text x="880" y="460">0.00176</text>
  </g>
  <line class="rulestrong" x1="24" y1="468" x2="890" y2="468"/>
  <text class="small name" x="24" y="486">doc, with its children</text>
  <g class="small name" text-anchor="end">
    <text x="300" y="486">0.0790</text><text x="400" y="486">0.0113</text>
    <text x="540" y="486" class="exttext">2.03</text><text x="640" y="486" class="exttext">0.582</text>
    <text x="780" y="486">2.11</text><text x="880" y="486">0.593</text>
  </g>
  <text class="small muted" x="24" y="516">Local: measured, × PUE 1.58, at DK's 143 gCO2e/kWh. External: Couch's published factors (2026), 0.39 Wh per 1k input and 1.95 Wh per 1k output tokens,</text>
  <text class="small muted" x="24" y="532">at 287 gCO2e/kWh (Jegham et al. 2025), never × this host's PUE. The two parts are kept apart in every report and added only in the total.</text>
</svg>
