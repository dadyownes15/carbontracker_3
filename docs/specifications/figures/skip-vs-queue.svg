<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="592" viewBox="0 0 1000 592" role="img" aria-labelledby="title desc">
  <title id="title">Queue waits for a read after the cut; Skip settles at once</title>
  <desc id="desc">One GPU energy counter, cooldown 1 second, and span S from 10.2 to 10.6 seconds. Under Queue, S waits for the read at 11.0 and is billed 59 J. Under Skip, S settles at 10.6 on the rate held from before 10.0 and is billed 24 J. The actual draw was 112 J.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --faint: #d1d9e0; --lane: #f6f8fa;
          --s: #2a9d8f; --warn: #e09f3e; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --faint: #3d444d; --lane: #161b22;
            --s: #36b3a2; --warn: #e8ab4f; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--fg);
           paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 16px; font-weight: 600; }
    .policy { font-size: 15px; font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11px; }
    .name { font-weight: 600; }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--faint); }
    .billed { fill: var(--s); fill-opacity: .4; }
    .swatch { fill: var(--s); fill-opacity: .4; }
    .actual { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 3; }
    .store { fill: none; stroke: var(--fg); stroke-width: 2.2; }
    .heldline { fill: none; stroke: var(--fg); stroke-width: 2.2; stroke-dasharray: 6 4; }
    .cut { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 2 3; opacity: .75; }
    .tri { fill: var(--fg); }
    .read { fill: var(--fg); stroke: var(--bg); stroke-width: 1.5; }
    .queued { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .skip { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .link { fill: none; stroke: var(--fg); stroke-width: 1.2; }
    .settle { fill: var(--fg); }
    .sep { stroke: var(--faint); stroke-width: 1; }
    .arrowhead { fill: var(--fg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="592"/>

  <text class="title" x="24" y="32">Queue waits for a read after the cut; Skip settles at once</text>
  <text class="muted" x="24" y="52">One GPU energy counter (NVML, cooldown 1 s) and span S from 10.2 to 10.6 s, inside the cooldown. The same draw and cuts in both.</text>

  <!-- ================= Queue ================= -->
  <text class="policy" x="24" y="124">Queue</text>
  <text class="small muted" x="24" y="141">the cut waits for a read</text>
  <text class="small muted" x="24" y="155">that starts after it</text>

  <text class="small" x="402" y="92" text-anchor="middle">start S<tspan class="muted"> 10.2</tspan></text>
  <text class="small" x="594" y="92" text-anchor="middle">stop S<tspan class="muted"> 10.6</tspan></text>
  <path d="M398,97 L406,97 L402,103 z" class="tri"/>
  <path d="M590,97 L598,97 L594,103 z" class="tri"/>

  <rect x="210" y="108" width="720" height="100" class="lane"/>
  <text class="small muted" x="204" y="118.7" text-anchor="end">280 W</text>
  <text class="small muted" x="204" y="162.7" text-anchor="end">148 W</text>
  <text class="small muted" x="204" y="192" text-anchor="end">60 W</text>
  <rect x="402" y="158.7" width="192" height="49.3" class="billed"/>
  <path d="M210,188 H402 V114.7 H594 V188 H930" class="actual"/>
  <path d="M210,188 H306 V158.7 H786" class="store"/>
  <line x1="402" y1="104" x2="402" y2="208" class="cut"/>
  <line x1="594" y1="104" x2="594" y2="208" class="cut"/>
  <text class="small muted" x="498" y="132" text-anchor="middle">actual draw: 112 J</text>
  <text class="name" x="498" y="200" text-anchor="middle">S: 59 J</text>
  <text class="small" x="604" y="152">148 W: the slope between reads 10.0 and 11.0</text>

  <text class="small muted" x="306" y="222" text-anchor="middle">read 10.0</text>
  <circle cx="306" cy="230" r="4" class="read"/>
  <rect x="398" y="226" width="8" height="8" class="queued"/>
  <line x1="594" y1="226" x2="594" y2="234" class="link"/>
  <text class="small muted" x="786" y="222" text-anchor="middle">read 11.0</text>
  <circle cx="786" cy="230" r="4" class="read"/>
  <path d="M402,237 Q594,272 781,236" class="link" marker-end="url(#arrow)"/>
  <path d="M594,237 Q690,262 781,236" class="link" marker-end="url(#arrow)"/>
  <path d="M800,224 L806,230 L800,236 L794,230 z" class="settle"/>
  <text class="small" x="812" y="234">S settles 11.02</text>
  <text class="small" x="594" y="278" text-anchor="middle">Start S queues one request; stop S relies on it. Read 11.0 answers both.</text>

  <line x1="24" y1="292" x2="976" y2="292" class="sep"/>

  <!-- ================= Skip ================= -->
  <text class="policy" x="24" y="348">Skip</text>
  <text class="small muted" x="24" y="365">the cut is answered at once,</text>
  <text class="small muted" x="24" y="379">on what the store holds</text>

  <text class="small" x="402" y="316" text-anchor="middle">start S<tspan class="muted"> 10.2</tspan></text>
  <text class="small" x="594" y="316" text-anchor="middle">stop S<tspan class="muted"> 10.6</tspan></text>
  <path d="M398,321 L406,321 L402,327 z" class="tri"/>
  <path d="M590,321 L598,321 L594,327 z" class="tri"/>

  <rect x="210" y="332" width="720" height="100" class="lane"/>
  <text class="small muted" x="204" y="342.7" text-anchor="end">280 W</text>
  <text class="small muted" x="204" y="416" text-anchor="end">60 W</text>
  <rect x="402" y="412" width="192" height="20" class="billed"/>
  <path d="M210,412 H402 V338.7 H594 V412 H930" class="actual"/>
  <path d="M210,412 H306" class="store"/>
  <path d="M306,412 H594" class="heldline"/>
  <line x1="402" y1="328" x2="402" y2="432" class="cut"/>
  <line x1="594" y1="328" x2="594" y2="432" class="cut"/>
  <text class="small muted" x="498" y="356" text-anchor="middle">actual draw: 112 J</text>
  <text class="name" x="498" y="426" text-anchor="middle">S: 24 J</text>
  <text class="small" x="604" y="404">60 W: the rate before 10.0, held past the last sample</text>

  <text class="small muted" x="306" y="446" text-anchor="middle">read 10.0</text>
  <circle cx="306" cy="454" r="4" class="read"/>
  <circle cx="402" cy="454" r="5" class="skip"/>
  <path d="M592,461 Q498,486 407,460" class="link" marker-end="url(#arrow)"/>
  <path d="M594,448 L600,454 L594,460 L588,454 z" class="settle"/>
  <text class="small" x="606" y="458">S settles 10.60</text>
  <text class="small muted" x="786" y="446" text-anchor="middle">read 11.0</text>
  <circle cx="786" cy="454" r="4" class="read"/>
  <text class="small muted" x="786" y="474" text-anchor="middle">lands after S settled; changes nothing</text>
  <text class="small" x="498" y="500" text-anchor="middle">Start S is Skipped at once; stop S relies on that answer.</text>

  <!-- Takeaway -->
  <text x="24" y="530">Queue settles S 0.42 s later and counts part of the burst. Skip settles at once and bills S the rate from before it began.</text>

  <!-- Legend -->
  <path d="M24,556 H46" class="actual"/>
  <text class="small" x="54" y="560">actual draw</text>
  <path d="M154,556 H176" class="store"/>
  <text class="small" x="184" y="560">power the store reads</text>
  <path d="M334,556 H356" class="heldline"/>
  <text class="small" x="364" y="560">held past the last sample</text>
  <rect x="530" y="550" width="22" height="12" class="swatch"/>
  <text class="small" x="560" y="560">billed to S</text>

  <circle cx="30" cy="578" r="4" class="read"/>
  <text class="small" x="54" y="582">read starts</text>
  <rect x="161" y="574" width="8" height="8" class="queued"/>
  <text class="small" x="184" y="582">request queued</text>
  <circle cx="345" cy="578" r="5" class="skip"/>
  <text class="small" x="364" y="582">request Skipped at once</text>
  <path d="M541,572 L547,578 L541,584 L535,578 z" class="settle"/>
  <text class="small" x="560" y="582">S settles</text>
  <path d="M684,582 Q696,570 708,580" class="link" marker-end="url(#arrow)"/>
  <text class="small" x="718" y="582">answered by</text>
</svg>
