<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Profiler mode waits for a read at each stop and subtracts the idle draw</title>
  <desc id="desc">One GPU energy counter, NVML, cooldown 1 second, idle draw 60 W. Two spans run back to back: tokenize, 0.15 s at 110 W, then forward, 0.4 s at 280 W. In tracker mode one read window covers both, so both are billed a flat 155.5 W: tokenize 23 J against a true 16.5 J, forward 62 J against a true 112 J. In profiler mode each span stays open until a read lands, and the idle draw over its window is subtracted: tokenize 7.5 J dynamic and 16.5 J gross, forward 88 J dynamic and 112 J gross, exactly the truth, in 2.0 s instead of 0.55 s.</desc>
  <style>
    svg { --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --faint: #d1d9e0; --lane: #f6f8fa;
          --a: #2a9d8f; --b: #e76f51; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --faint: #3d444d; --lane: #161b22;
            --a: #36b3a2; --b: #f08a6c; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: var(--fg);
           paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; }
    .title { font-size: 16px; font-weight: 600; }
    .mode { font-size: 15px; font-weight: 600; }
    .muted { fill: var(--muted); }
    .small { font-size: 11px; }
    .name { font-weight: 600; }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); stroke: var(--faint); }
    .a { fill: var(--a); fill-opacity: .45; }
    .b { fill: var(--b); fill-opacity: .45; }
    .a-solid { fill: var(--a); fill-opacity: .85; }
    .b-solid { fill: var(--b); fill-opacity: .85; }
    .a-wait { fill: var(--a); fill-opacity: .18; stroke: var(--a); stroke-dasharray: 3 2; }
    .b-wait { fill: var(--b); fill-opacity: .18; stroke: var(--b); stroke-dasharray: 3 2; }
    .actual { fill: none; stroke: var(--fg); stroke-width: 2; }
    .flat { fill: none; stroke: var(--fg); stroke-width: 2; stroke-dasharray: 6 4; }
    .base { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 2 3; }
    .cut { stroke: var(--fg); stroke-width: 1; stroke-dasharray: 2 3; opacity: .7; }
    .read { fill: var(--fg); stroke: var(--bg); stroke-width: 1.5; }
    .queued { fill: var(--bg); stroke: var(--fg); stroke-width: 1.5; }
    .link { fill: none; stroke: var(--fg); stroke-width: 1.2; }
    .axis { stroke: var(--muted); stroke-width: 1; }
    .tick { stroke: var(--muted); stroke-width: 1; }
    .arrowhead { fill: var(--fg); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" class="arrowhead"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="700"/>

  <text class="title" x="24" y="32">Profiler mode waits for a read at each stop, then subtracts the idle draw</text>
  <text class="muted" x="24" y="52">One GPU energy counter (NVML, cooldown 1 s, idle 60 W). tokenize: 0.15 s at 110 W, then forward: 0.4 s at 280 W.</text>

  <!-- ================= Tracker mode ================= -->
  <text class="mode" x="24" y="104">Tracker mode</text>
  <text class="small muted" x="24" y="121">no wait: one read</text>
  <text class="small muted" x="24" y="135">window covers both</text>

  <rect x="210" y="80" width="720" height="100" class="lane"/>
  <text class="small muted" x="204" y="90.7" text-anchor="end">280 W</text>
  <text class="small muted" x="204" y="163.7" text-anchor="end">60 W</text>
  <!-- billed: flat 155.5 W over [0, 1.0) -->
  <rect x="210" y="128.2" width="54" height="51.8" class="a"/>
  <rect x="264" y="128.2" width="144" height="51.8" class="b"/>
  <!-- actual draw: 110 W, 280 W, then 60 W -->
  <path d="M210,143.3 H264 V86.7 H408 V160 H930" class="actual"/>
  <path d="M210,128.2 H570" class="flat"/>
  <text class="small" x="576" y="132">155.5 W: the window's mean, over both spans</text>
  <line x1="264" y1="74" x2="264" y2="230" class="cut"/>
  <line x1="408" y1="74" x2="408" y2="230" class="cut"/>

  <rect x="210" y="190" width="54" height="18" class="a-solid"/>
  <rect x="264" y="190" width="144" height="18" class="b-solid"/>
  <text class="small" x="237" y="222" text-anchor="middle">tokenize</text>
  <text class="small" x="336" y="222" text-anchor="middle">forward</text>

  <circle cx="210" cy="244" r="4" class="read"/>
  <text class="small muted" x="210" y="262" text-anchor="middle">read 0.0</text>
  <rect x="404" y="240" width="8" height="8" class="queued"/>
  <path d="M414,244 L563,244" class="link" marker-end="url(#arrow)"/>
  <circle cx="570" cy="244" r="4" class="read"/>
  <text class="small muted" x="570" y="262" text-anchor="middle">read 1.0</text>

  <text x="620" y="204"><tspan class="name">tokenize</tspan> 23 J <tspan class="muted">(true 16.5 J, +41 %)</tspan></text>
  <text x="620" y="224"><tspan class="name">forward</tspan> 62 J <tspan class="muted">(true 112 J, −45 %)</tspan></text>
  <text class="small muted" x="620" y="244">done at 0.55 s</text>

  <line x1="24" y1="286" x2="976" y2="286" class="tick" opacity=".4"/>

  <!-- ================= Profiler mode ================= -->
  <text class="mode" x="24" y="334">Profiler mode</text>
  <text class="small muted" x="24" y="351">each span stays open</text>
  <text class="small muted" x="24" y="365">until a read lands</text>

  <rect x="210" y="310" width="720" height="100" class="lane"/>
  <text class="small muted" x="204" y="320.7" text-anchor="end">280 W</text>
  <text class="small muted" x="204" y="393.7" text-anchor="end">60 W</text>
  <!-- dynamic: above baseline, during work only -->
  <rect x="210" y="373.3" width="54" height="16.7" class="a"/>
  <rect x="570" y="316.7" width="144" height="73.3" class="b"/>
  <!-- actual draw -->
  <path d="M210,373.3 H264 V390 H570 V316.7 H714 V390 H930" class="actual"/>
  <path d="M210,390 H930" class="base"/>
  <text class="small muted" x="926" y="404" text-anchor="end">baseline 60 W, measured at start</text>
  <line x1="264" y1="304" x2="264" y2="460" class="cut"/>
  <line x1="570" y1="304" x2="570" y2="460" class="cut"/>
  <line x1="714" y1="304" x2="714" y2="460" class="cut"/>
  <line x1="930" y1="304" x2="930" y2="460" class="cut"/>

  <!-- span windows: work, then the wait -->
  <rect x="210" y="420" width="54" height="18" class="a-solid"/>
  <rect x="264" y="420" width="306" height="18" class="a-wait"/>
  <rect x="570" y="420" width="144" height="18" class="b-solid"/>
  <rect x="714" y="420" width="216" height="18" class="b-wait"/>
  <text class="small" x="237" y="452" text-anchor="middle">tokenize</text>
  <text class="small muted" x="417" y="452" text-anchor="middle">waits 0.85 s</text>
  <text class="small" x="642" y="452" text-anchor="middle">forward</text>
  <text class="small muted" x="822" y="452" text-anchor="middle">waits 0.6 s</text>

  <circle cx="210" cy="474" r="4" class="read"/>
  <text class="small muted" x="210" y="492" text-anchor="middle">read 0.0</text>
  <rect x="260" y="470" width="8" height="8" class="queued"/>
  <path d="M270,474 L563,474" class="link" marker-end="url(#arrow)"/>
  <circle cx="570" cy="474" r="4" class="read"/>
  <text class="small muted" x="570" y="492" text-anchor="middle">read 1.0</text>
  <rect x="710" y="470" width="8" height="8" class="queued"/>
  <path d="M720,474 L923,474" class="link" marker-end="url(#arrow)"/>
  <circle cx="930" cy="474" r="4" class="read"/>
  <text class="small muted" x="930" y="492" text-anchor="middle">read 2.0</text>

  <!-- arithmetic -->
  <text x="210" y="528"><tspan class="name">tokenize</tspan> window 0.0–1.0: 67.5 J measured − 60 W × 1.0 s = <tspan class="name">7.5 J dynamic</tspan>; + 60 W × 0.15 s = <tspan class="name">16.5 J gross</tspan> (true 16.5 J)</text>
  <text x="210" y="550"><tspan class="name">forward</tspan> window 1.0–2.0: 148 J measured − 60 W × 1.0 s = <tspan class="name">88 J dynamic</tspan>; + 60 W × 0.4 s = <tspan class="name">112 J gross</tspan> (true 112 J)</text>
  <text class="small muted" x="210" y="570">forward starts on the read that ended tokenize, so it waits for nothing before it starts. Done at 2.0 s.</text>

  <!-- Takeaway -->
  <text x="24" y="612">Waiting puts a read on each stop; subtracting the idle draw removes the wait. Tracker mode is 3.6× faster and blurs both spans into one mean.</text>

  <!-- Legend -->
  <path d="M24,646 H46" class="actual"/>
  <text class="small" x="54" y="650">actual draw</text>
  <path d="M144,646 H166" class="flat"/>
  <text class="small" x="174" y="650">billed rate, tracker mode</text>
  <path d="M324,646 H346" class="base"/>
  <text class="small" x="354" y="650">baseline</text>
  <rect x="424" y="640" width="22" height="12" class="a"/>
  <rect x="448" y="640" width="22" height="12" class="b"/>
  <text class="small" x="478" y="650">billed (tracker) / dynamic (profiler)</text>

  <circle cx="30" cy="672" r="4" class="read"/>
  <text class="small" x="54" y="676">read</text>
  <rect x="151" y="668" width="8" height="8" class="queued"/>
  <text class="small" x="174" y="676">cut inside the cooldown: request queued</text>
  <rect x="424" y="668" width="22" height="10" class="a-solid"/>
  <text class="small" x="452" y="676">span's work</text>
  <rect x="544" y="668" width="22" height="10" class="a-wait"/>
  <text class="small" x="572" y="676">span's wait, inside the span</text>
  <line x1="770" y1="664" x2="770" y2="682" class="cut"/>
  <text class="small" x="780" y="676">cut</text>
</svg>
