[package]
name = "carbontracker-run"
version.workspace = true
edition = "2024"
description = "A carbontracker run: its lifecycle, what it writes, and what frontends derive from it."

[dependencies]
carbontracker = { path = "../engine" }
carbontracker-providers = { path = "../providers" }
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "time", "net"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
