[package]
name = "carbontracker"
version.workspace = true
edition = "2024"

[dependencies]
chrono = "0.4.45"
# Serialize for every exported type, for sinks that write JSON.
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[features]
serde = ["dep:serde", "chrono/serde"]
# The pure replay the QuickCheck suite in quickcheck/ drives.
replay = ["serde", "dep:serde_json"]

[dev-dependencies]
chrono = "0.4.45"
proptest = "1"
quickcheck = "1"
serde_json = "1"

[[bin]]
name = "replay-pure"
path = "src/bin/replay_pure.rs"
required-features = ["replay"]
