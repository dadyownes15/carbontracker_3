[package]
name = "carbontracker-providers"
version.workspace = true
edition = "2024"
description = "The default provider registry: probes this host for power and grid-intensity sources."

[dependencies]
carbontracker = { path = "../engine" }
chrono = "0.4.45"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "blocking"] }
serde_json = "1"
thiserror = "2.0.21"
# Dlopens libnvidia-ml at runtime; builds everywhere, declines without a driver.
nvml-wrapper = "0.13"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "process"] }
toml = "0.8"
tower = { version = "0.5.3", features = ["util", "limit"] }

[target.'cfg(target_os = "macos")'.dependencies]
macmon = { version = "0.8", default-features = false }
core-foundation = "0.10"
core-foundation-sys = "0.8"

[dev-dependencies]
futures = "0.3.34"
tempfile = "3"
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6.5"
