name: quickcheck

# Generated programs replayed through the session and the engine with no
# threads and no clock. It finds new counterexamples, so it runs when the
# engine or the suite changes, and nightly; the ones it has found are
# replayed on every run of ci.yml.
on:
  pull_request:
    paths:
      - "crates/engine/**"
      - "quickcheck/**"
      - "Cargo.lock"
      - ".github/workflows/quickcheck.yml"
  push:
    branches: [main]
    paths:
      - "crates/engine/**"
      - "quickcheck/**"
      - "Cargo.lock"
      - ".github/workflows/quickcheck.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: quickcheck-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quickcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: "9.10"
          cabal-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ steps.haskell.outputs.ghc-version }}-${{ hashFiles('quickcheck/quickcheck.cabal') }}
      - run: cargo build -p carbontracker --features replay --bins
      - run: cabal update && cabal test -v0 --test-show-details=direct
        working-directory: quickcheck
        env:
          QUICKCHECK_CASES: "100"
      # A counterexample to keep: copy it to crates/engine/tests/replay-cases/
      # with a test in replay_cases.rs.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: quickcheck-failures
          path: quickcheck/failures/
