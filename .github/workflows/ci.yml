name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Python crate links against an interpreter; pin it rather than take
      # whichever Python the runner image ships.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: cargo test --workspace
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  python:
    # Tests the built wheel, not an editable install, so packaging is covered too.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    # Pinned: setup-python has no Python 3.9 for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install "maturin>=1.9.4,<2" pytest
      - run: maturin build --release -m crates/python/Cargo.toml -o dist
      - run: pip install dist/*.whl
      - run: carbontracker --help
      # From inside tests/ so the installed package is imported, not the source tree.
      - run: pytest -q
        working-directory: crates/python/tests

  quickcheck:
    # Generated programs replayed through the session and the engine with no
    # threads and no clock: the same result on any runner.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: haskell-actions/setup@v2
        id: haskell
        with:
          ghc-version: "9.10"
          cabal-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ steps.haskell.outputs.ghc-version }}-${{ hashFiles('quickcheck/quickcheck.cabal') }}
      - run: cargo build -p carbontracker --features replay --bins
      - run: cabal update && cabal test -v0 --test-show-details=direct
        working-directory: quickcheck
        env:
          QUICKCHECK_CASES: "100"
