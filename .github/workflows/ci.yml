name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    # Tests the built wheel, not an editable install, so packaging is covered too.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    # Pinned: setup-python has no Python 3.9 for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install "maturin>=1.9.4,<2" pytest
      - run: maturin build --release -m crates/python/Cargo.toml -o dist
      - run: pip install dist/*.whl
      - run: carbontracker --help
      # From inside tests/ so the installed package is imported, not the source tree.
      - run: pytest -q
        working-directory: crates/python/tests
