name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every symbol a specification anchors is exported, and every rule is cited
  # by a test or marked why not.
  specifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh docs/check-specifications.sh
      - run: sh docs/check-conformance.sh

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The Python crate links against an interpreter; pin it rather than take
      # whichever Python the runner image ships.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: cargo test --workspace
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}
      # Counterexamples QuickCheck found, replayed without GHC.
      - run: cargo test -p carbontracker --features replay --test replay_cases

  python:
    # Tests the built wheel, not an editable install, so packaging is covered too.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    # Pinned: setup-python has no Python 3.9 for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install "maturin>=1.9.4,<2" pytest
      - run: maturin build --release -m crates/python/Cargo.toml -o dist
      - run: pip install dist/*.whl
      - run: carbontracker --help
      # From inside tests/ so the installed package is imported, not the source tree.
      - run: pytest -q
        working-directory: crates/python/tests
