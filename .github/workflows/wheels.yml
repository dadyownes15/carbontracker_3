name: wheels

# Push a tag such as v3.0.0.dev1 to build wheels and publish a prerelease.
# The tag must match the version in crates/python/pyproject.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64, test: true }
          - { os: macos-latest, target: aarch64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/python/pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release -m crates/python/Cargo.toml -o dist
      - uses: actions/setup-python@v5
        if: matrix.test
        with:
          python-version: "3.12"
      - name: Test the wheel
        if: matrix.test
        run: |
          pip install dist/*.whl
          carbontracker --help
          carbontracker --no-log --global --power 10 --intensity 100 python -c "print('tracked')"
          python -c "from carbontracker import CarbonTracker; t = CarbonTracker(epochs=1, power=10, intensity=100, global_=True, verbose=0); t.epoch_start(); t.epoch_end(); assert t.stop().total.energy_kwh > 0"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m crates/python/Cargo.toml -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "$GITHUB_REF_NAME" --notes "Internal dev build."
